spring.application.name=getcard

# Configuração do banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/getcarddb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Usar Hibernate para criar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

google.service.account.key.path=src/main/resources/credenciais.json
google.drive.folder-id=1Gypp9zae4xDzYKIP3gBV5V1wu7Wu5lmf


# Permitir acesso sem autenticação
spring.security.user.name=admin
spring.security.user.password=admin


